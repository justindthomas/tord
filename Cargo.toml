[package]
name = "tord"
version = "0.1.0"
edition = "2021"
description = "VPP-native anonymising SOCKS5 proxy with Tor egress"
license = "AGPL-3.0-or-later"
authors = ["Justin Thomas"]

[dependencies]
# Tor client + runtime abstraction. arti is driven through a custom
# tor_rtcompat::Runtime so its circuit egress rides VPP's session
# layer instead of the kernel stack. Versions track the arti
# workspace in lockstep (tor-rtcompat 0.42.x at time of scaffolding);
# verify + pin against the actual published versions before phase 2.
arti-client = { version = "0.42", default-features = false, features = ["tokio", "rustls"] }
tor-rtcompat = { version = "0.42", default-features = false, features = ["tokio", "rustls"] }

# arti's on-disk state store (tor-persist) pulls in rusqlite ->
# libsqlite3-sys, which by default link-searches for a *system*
# libsqlite3 (present on macOS, absent in a Bookworm build container).
# Depend on it directly with `bundled` so SQLite is compiled into the
# binary via cargo's feature unification — nothing extra to apt-install
# at build time, no libsqlite3 shared object to ship.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

# VCL transport — SOCKS listener + arti egress through VPP's session
# layer. Optional: `--no-default-features --features kernel-sockets`
# drops the libvppcom link for dev builds on non-VPP hosts (macOS).
vcl-rs = { git = "https://github.com/justindthomas/vcl-rs", optional = true }

# Runtime
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# arti's NetStreamProvider streams are futures::io flavour; VclStream
# is tokio::io flavour. tokio-util's Compat bridges the two.
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }

# TLS for arti's OR-link handshake (layered over the VCL stream).
rustls = "0.23"

# Config + CLI + control socket
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
nix = { version = "0.29", features = ["signal", "socket"] }
libc = "0.2"
rand = "0.8"

[features]
default = ["vcl"]
# Transport backend — exactly one must be enabled (see runtime/mod.rs).
vcl = ["dep:vcl-rs"]
kernel-sockets = []

[lib]
name = "tord"
path = "src/lib.rs"

[[bin]]
name = "tord"
path = "src/main.rs"

# Local development override: when ../vcl-rs exists alongside the tord
# checkout, prefer the local copy over the git dependency.
[patch."https://github.com/justindthomas/vcl-rs"]
vcl-rs = { path = "../vcl-rs" }
